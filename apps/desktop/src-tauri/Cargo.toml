[package]
name = "tabula-desktop"
version = "0.1.0"
description = "Tabularium — shell desktop"
authors = ["Paulo Vinicius"]
license = "MIT"
repository = "https://github.com/paulo-vc/tabula-rpg"
edition = "2024"
rust-version = "1.90"

[lib]
name = "tabula_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
