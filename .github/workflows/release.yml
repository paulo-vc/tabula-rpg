name: Release

# Disparado ao publicar uma tag `v*` (ex.: v0.1.0). Gera instaladores e cria um
# rascunho de release no GitHub — revisado manualmente antes de ser publicado.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Dependências de sistema do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assina os instaladores para a atualização automática (o app só aceita
          # atualizações assinadas com esta chave). Sem os segredos, o build falha.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Tabularium ${{ github.ref_name }}'
          releaseDraft: true
          # Versão normal (não pré-lançamento): o app procura a atualização em
          # releases/latest, que ignora pré-lançamentos.
          prerelease: false
          args: ${{ matrix.args }}
          # Também publica o .exe solto: "executável único" que roda sem instalar.
          uploadPlainBinary: true
          # latest.json: o arquivo que o app consulta. No Windows, atualiza pelo
          # instalador NSIS (o mesmo do download recomendado).
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
